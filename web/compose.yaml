version: "3.9"

services:
  vocab-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: llapp
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:Z
      - /app/node_modules
    command: npx nodemon --legacy-watch server.js
    environment:
      - API_KEY=supersecretkey
